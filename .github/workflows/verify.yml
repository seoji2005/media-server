name: Product checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      PYTHONUTF8: '1'
      HF_HUB_OFFLINE: '1'
      MEDIA_TEST_BROWSER_CHANNEL: chrome
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install FFmpeg on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-noto-cjk
      - name: Install FFmpeg on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Same Gyan essentials build distributed by choco ffmpeg. Pin both bytes
          # and version; a failed package feed must not look like installation.
          # https://www.gyan.dev/ffmpeg/builds/packages/ffmpeg-9.0.1-essentials_build.zip.sha256
          $archivePath = Join-Path $env:RUNNER_TEMP 'ffmpeg-9.0.1.zip'
          $extractPath = Join-Path $env:RUNNER_TEMP 'media-ffmpeg'
          Invoke-WebRequest -Uri 'https://www.gyan.dev/ffmpeg/builds/packages/ffmpeg-9.0.1-essentials_build.zip' -OutFile $archivePath -TimeoutSec 120
          $expectedSha = 'fec81ae03971d9dd4be3ebe02e263bd2ec1d789483f931bdba5f5715e65da2e9'
          if ((Get-FileHash $archivePath -Algorithm SHA256).Hash -ne $expectedSha) {
            throw 'FFmpeg archive checksum mismatch'
          }
          Expand-Archive -LiteralPath $archivePath -DestinationPath $extractPath
          $binaryDirectory = Join-Path $extractPath 'ffmpeg-9.0.1-essentials_build/bin'
          foreach ($toolName in @('ffmpeg', 'ffprobe')) {
            $toolPath = Join-Path $binaryDirectory "$toolName.exe"
            if (!(Test-Path -LiteralPath $toolPath -PathType Leaf)) { throw 'FFmpeg tools missing' }
            $toolVersion = & $toolPath -version
            if ($LASTEXITCODE -ne 0 -or !$toolVersion[0].StartsWith("$toolName version 9.0.1")) {
              throw 'FFmpeg tool version check failed'
            }
            Write-Output $toolVersion[0]
          }
          $binaryDirectory | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - run: python -m pip install -r requirements-dev.txt
      - run: npm ci --prefix tests/ui --no-audit --no-fund
      - run: python scripts/harness.py run test
        env:
          MEDIA_TEST_SCREENSHOT_DIR: ${{ runner.temp }}/media-server-browser
      - name: Save synthetic browser views
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-views-${{ runner.os }}
          path: ${{ runner.temp }}/media-server-browser/*.png
          if-no-files-found: error
          retention-days: 7
